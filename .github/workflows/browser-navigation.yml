name: Browser navigation regression

on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/browser-navigation.yml'

permissions:
  contents: read

jobs:
  browser-return:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          chmod +x gradlew
      - name: Verify browser return on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest -PmpvAbis=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=dev.davplayer.app.ui.BrowserReturnTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-navigation-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
