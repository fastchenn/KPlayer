name: Correct 0.3.3 release title
on:
  push:
    branches: [main]
    paths: ['.github/workflows/correct-release-title.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Set requested release title
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit v0.3.3 --title "K Player 0.3.3"
