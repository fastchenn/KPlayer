name: Android checks

on:
  workflow_dispatch:
  push:
    branches: [main, fix/continuous-cache]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Release tooling regression checks
        run: python -m unittest discover -s tools -p 'test_release.py' -v
      - name: Release tests, lint and unsigned APK
        run: ./gradlew :playback:mpv:testReleaseUnitTest :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: k-player-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Verify metadata and sign installable APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/continuous-cache'
        env:
          KPLAYER_RELEASE_SIGNING: ${{ secrets.KPLAYER_RELEASE_SIGNING }}
        run: |
          python tools/release.py prepare
          python tools/release.py sign
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/continuous-cache'
        with:
          name: k-player-0.3.4-signed
          path: dist/0.3.4/*
          if-no-files-found: error
          retention-days: 14
      - name: Debug APK and device test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :playback:mpv:assembleDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: k-player-mpv-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verification
          path: |
            app/build/reports/tests/testReleaseUnitTest/
            playback/mpv/build/reports/tests/testReleaseUnitTest/
            app/build/reports/lint-results-release.*
          if-no-files-found: ignore
