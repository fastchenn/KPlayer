name: Android checks

on:
  workflow_dispatch:
    inputs:
      sign_test_apk:
        description: 'Build an installable APK with the fixed certificate, without publishing'
        type: boolean
        default: false
  push:
    branches: [main, fix/continuous-cache, fix/cache-timeline]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Media regression fixture tools
        run: command -v ffmpeg && command -v ffprobe || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Release tooling regression checks
        run: python -m unittest discover -s tools -p 'test_release.py' -v
      - name: Release tests, lint and unsigned APK
        run: ./gradlew :playback:mpv:testReleaseUnitTest :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: k-player-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Verify metadata and sign installable APK
        id: signed
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/fix/continuous-cache' || github.ref == 'refs/heads/fix/cache-timeline') && github.actor == github.repository_owner) || (github.event_name == 'workflow_dispatch' && inputs.sign_test_apk && github.actor == github.repository_owner)
        env:
          KPLAYER_RELEASE_SIGNING: ${{ secrets.KPLAYER_RELEASE_SIGNING }}
        run: |
          python tools/release.py prepare --output "$GITHUB_OUTPUT"
          python tools/release.py sign
      - uses: actions/upload-artifact@v4
        if: steps.signed.outcome == 'success'
        with:
          name: ${{ steps.signed.outputs.artifact }}
          path: ${{ steps.signed.outputs.directory }}/*
          if-no-files-found: error
          retention-days: 14
      - name: Debug APK and device test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :playback:mpv:assembleDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: k-player-mpv-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verification
          path: |
            app/build/reports/tests/testReleaseUnitTest/
            playback/mpv/build/reports/tests/testReleaseUnitTest/
            app/build/reports/lint-results-release.*
          if-no-files-found: ignore
