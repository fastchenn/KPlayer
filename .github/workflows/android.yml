name: Android checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Release tests, lint and unsigned APK
        run: ./gradlew :playback:mpv:testReleaseUnitTest :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease --no-daemon
      - name: Debug APK and device test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :playback:mpv:assembleDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: k-player-mpv-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verification
          path: |
            app/build/reports/tests/testReleaseUnitTest/
            playback/mpv/build/reports/tests/testReleaseUnitTest/
            app/build/reports/lint-results-release.*
          if-no-files-found: ignore

  release-v030:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-v0.3.0
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Check 0.3.0 release eligibility
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if ! python - <<'PY'
          import re
          from pathlib import Path
          text = Path('app/build.gradle.kts').read_text()
          assert re.search(r'versionName\s*=\s*"0\.3\.0"', text)
          assert re.search(r'versionCode\s*=\s*8\b', text)
          PY
          then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          elif gh release view v0.3.0 >/dev/null 2>&1; then
            echo 'v0.3.0 already exists; keeping its tag and assets unchanged.'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.release.outputs.publish == 'true'
        with:
          name: k-player-mpv-debug
          path: dist/0.3.0
      - uses: actions/setup-java@v4
        if: steps.release.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: steps.release.outputs.publish == 'true'
        with:
          packages: 'platform-tools build-tools;35.0.0'
      - name: Verify the exact APK from this run
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mv dist/0.3.0/app-debug.apk dist/0.3.0/k-player-0.3.0-arm64.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          apk='dist/0.3.0/k-player-0.3.0-arm64.apk'
          "$tools/apksigner" verify --verbose --print-certs "$apk" > dist/0.3.0/APK-SIGNATURE.txt
          "$tools/zipalign" -c -P 16 4 "$apk"
          "$tools/aapt" dump badging "$apk" > /tmp/kplayer-030-badging.txt
          python - <<'PY'
          from pathlib import Path
          text = Path('/tmp/kplayer-030-badging.txt').read_text()
          package = next(line for line in text.splitlines() if line.startswith('package:'))
          assert "name='dev.davplayer.app'" in package, package
          assert "versionCode='8'" in package and "versionName='0.3.0'" in package, package
          assert "native-code: 'arm64-v8a'" in text, text
          assert "application-debuggable" in text, 'Expected the tested Debug build type'
          PY
      - name: Restore pinned source archives and package current corresponding sources
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kplayer-previous-sources
          gh release download v0.2.5 --pattern k-player-0.2.5-native-sources.zip --dir /tmp/kplayer-previous-sources
          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path
          manifest = json.loads(Path('playback/mpv/native-sources.json').read_text())
          cache = Path('.gradle/native-sources')
          cache.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile('/tmp/kplayer-previous-sources/k-player-0.2.5-native-sources.zip') as previous:
              for source in manifest['sources']:
                  name = source['archive']
                  assert Path(name).name == name
                  (cache / name).write_bytes(previous.read('archives/' + name))
          PY
          python tools/package_native_sources.py --output dist/0.3.0/k-player-0.3.0-native-sources.zip
      - name: Generate checksums and publish v0.3.0
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          (cd dist/0.3.0 && sha256sum k-player-0.3.0-arm64.apk k-player-0.3.0-native-sources.zip APK-SIGNATURE.txt > SHA256SUMS.txt)
          gh release create v0.3.0 \
            --target "$GITHUB_SHA" \
            --title 'K Player 0.3.0' \
            --notes-file docs/releases/v0.3.0.md \
            --latest \
            dist/0.3.0/k-player-0.3.0-arm64.apk \
            dist/0.3.0/k-player-0.3.0-native-sources.zip \
            dist/0.3.0/APK-SIGNATURE.txt \
            dist/0.3.0/SHA256SUMS.txt
