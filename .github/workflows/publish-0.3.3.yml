name: Publish requested 0.3.3 release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-0.3.3.yml']

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify requested release version
        run: python -c 'from tools.release import metadata; assert metadata() == ("0.3.3", 11)'
      - name: Run existing fixed-certificate release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run release.yml --ref main -f publish=true
      - name: Remove discarded standalone preview run and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method DELETE "repos/$GH_REPO/actions/runs/39284527034"
