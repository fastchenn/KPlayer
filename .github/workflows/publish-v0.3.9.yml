name: Publish K Player 0.3.9

on:
  push:
    branches: [main]
    paths: ['docs/releases/v0.3.9.md']

permissions:
  contents: write

jobs:
  publish:
    if: github.actor == github.repository_owner && contains(github.event.head_commit.message, '[publish 0.3.9]')
    uses: ./.github/workflows/release.yml
    with:
      publish: true
      expected_version: '0.3.9'
    secrets:
      KPLAYER_RELEASE_SIGNING: ${{ secrets.KPLAYER_RELEASE_SIGNING }}
